server {
  listen 80;
  server_name helpsystempro.site www.helpsystempro.site _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location = /health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location /tools/ {
    try_files $uri $uri/ /tools/index.html;
  }

  location /bot/ {
    try_files $uri $uri/ /bot/index.html;
  }

  location /api/proxy {
    default_type application/json;
    return 503 '{"ok":false,"error":"Proxy desativado até configurar allowlist segura."}';
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
    try_files $uri =404;
  }
}

server {
  listen 80;
  server_name bot.helpsystempro.site;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location = /health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location = / {
    try_files /bot/index.html =404;
  }

  location / {
    try_files $uri /bot$uri /bot/index.html;
  }
}
